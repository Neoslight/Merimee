<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Exploration cartographique et chronologique des 46 760 immeubles protégés au titre des monuments historiques (base Mérimée)." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />

    <!-- Carte de lien. L'URL de l'image doit être absolue : les agrégateurs ne
         résolvent pas un chemin relatif, et `%sveltekit.assets%` n'en produit
         pas d'absolu. Elle est donc figée sur le domaine de publication, et
         cesserait d'être valable si le site déménageait. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mérimée" />
    <meta property="og:title" content="Mérimée — 46 760 monuments historiques" />
    <meta property="og:description" content="Carte, filtrage croisé et double frise : époque de construction contre année de protection, de 1840 à 2026." />
    <meta property="og:url" content="https://neoslight.github.io/Merimee/" />
    <meta property="og:image" content="https://neoslight.github.io/Merimee/apercu-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
