    <!-- La feuille CARTO puis ses sprites, polices et tuiles partent d'un autre
         domaine : sur un reseau mobile, la poignee de main TLS se paie avant la
         moindre tuile. Deux hotes, releves dans style.json : la feuille sur
         `basemaps`, tout le reste sur `tiles.basemaps`. -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin />

    <!-- Pose le theme avant le premier paint. Sans ce script la page s'affiche
         en sombre puis bascule : le site est prerendu, aucun rendu serveur ne
         connait la preference du visiteur. Le nom de la cle est repris dans
         `lib/state/theme.svelte.ts`. -->
    <script>
      try {
        var t = localStorage.getItem('merimee-theme');
        if (t !== 'clair' && t !== 'sombre')
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'clair' : 'sombre';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!-- Carte de lien. L'URL de l'image doit être absolue : les agrégateurs ne
         résolvent pas un chemin relatif, et `.` n'en produit
         pas d'absolu. Elle est donc figée sur le domaine de publication, et
         cesserait d'être valable si le site déménageait. -->
    <meta property="og:type" content="website" />
